services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: investment_agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d investment_agent"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/investment_agent
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/investment_agent
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: [./data:/app/data]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/investment_agent
    command: ["python", "-m", "app.jobs.worker"]
    volumes: [./data:/app/data]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
